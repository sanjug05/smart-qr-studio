#:schema node_modules/wrangler/config-schema.json
name = "smart-qr-studio-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Default (unnamed) environment — used by `wrangler dev` with no --env flag
# and by the local Vitest suite (test/api.test.ts). Mirrors "development".
[vars]
ENVIRONMENT = "development"
# Comma-separated list of origins allowed to call the management endpoints.
# Environment-driven on purpose (see README → "CORS") — never hardcoded in
# source. Vite's local dev server origin by default.
ALLOWED_ORIGINS = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "smart-qr-studio-dev"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# development — for local iteration and `wrangler dev --env development`.
# Dynamic QR is enabled unconditionally here so it can be tested without any
# billing/entitlement system existing yet (see src/lib/entitlements.ts).
# ---------------------------------------------------------------------------
[env.development]
vars = { ENVIRONMENT = "development", ALLOWED_ORIGINS = "http://localhost:5173" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "smart-qr-studio-dev"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# staging — a real deployed Worker + D1 database for pre-production testing.
# Update ALLOWED_ORIGINS if a staging frontend URL is added later.
# ---------------------------------------------------------------------------
[env.staging]
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "http://localhost:5173,https://sanjug05.github.io" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "smart-qr-studio-staging"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# production — dynamicQr defaults to false for every caller here unless a
# future plan/billing system says otherwise (see src/lib/entitlements.ts).
#
# To test Dynamic QR end-to-end against this exact configuration without
# enabling it for real production traffic, provision (never commit) a
# secret — this is deliberately NOT a `vars` entry above, since `vars` are
# plaintext in wrangler.toml and this value must not be:
#   npx wrangler secret put DYNAMIC_QR_TEST_OVERRIDE_SECRET --env production
# Then send `X-Dynamic-QR-Test-Override: <that value>` on POST /v1/qr from
# the test build only. Leaving this secret unset (the default) means the
# override path does not exist at all — see src/lib/entitlements.ts.
# ---------------------------------------------------------------------------
[env.production]
vars = { ENVIRONMENT = "production", ALLOWED_ORIGINS = "https://sanjug05.github.io" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "smart-qr-studio-prod"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "migrations"
