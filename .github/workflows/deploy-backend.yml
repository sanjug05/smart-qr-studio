name: Deploy Dynamic QR Backend (Firebase)

# Only runs when the backend or its Firebase configuration changes — the
# frontend's own deploy.yml is completely separate.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".firebaserc"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Matches `engines.node` in backend/package.json (the Cloud Functions runtime).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      # Fails fast with an explicit message instead of letting the Firebase
      # CLI die later with an ambiguous auth error. Checks presence only —
      # the credential itself is never echoed.
      - name: Check deploy prerequisites
        working-directory: .
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Missing FIREBASE_SERVICE_ACCOUNT::Add a FIREBASE_SERVICE_ACCOUNT repository secret (Settings > Secrets and variables > Actions) containing a service-account JSON key for the Firebase project with Cloud Functions, Firestore and Service Usage permissions, then re-run this workflow."
            exit 1
          fi
          if ! grep -q '"default": "[a-z0-9-]\+"' .firebaserc; then
            echo "::error title=No Firebase project::.firebaserc has no default project."
            exit 1
          fi

      # Writes the key to a temporary file for this job only and exports
      # GOOGLE_APPLICATION_CREDENTIALS; nothing is committed or logged.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Functions + Firestore rules
        working-directory: .
        run: npx --yes firebase-tools@15 deploy --only functions,firestore --non-interactive
