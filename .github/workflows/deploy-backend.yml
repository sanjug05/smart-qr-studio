name: Deploy Dynamic QR Backend

# Only runs when something under backend/ actually changes — the frontend's
# own deploy.yml is completely separate and untouched by this workflow.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Wrangler 4 requires Node >= 22 (see backend/node_modules/wrangler's
      # "engines"); on Node 20 it exits immediately with "Wrangler requires at
      # least Node.js v22.0.0", before any migration or deploy runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test

      # Fails fast with an explicit message instead of letting wrangler die
      # later with an ambiguous auth/config error. Checks only presence —
      # the token itself is never echoed.
      - name: Check production deploy prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Add a CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions) with Workers + D1 edit permissions, then re-run this workflow."
            exit 1
          fi
          if awk 'index($0, "[[env.production.d1_databases]]") == 1 {f=1; next} substr($0, 1, 1) == "[" {f=0} f && index($0, "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT") {found=1} END {exit !found}' wrangler.toml; then
            echo "::error title=Production D1 database_id not set::backend/wrangler.toml [[env.production.d1_databases]] still has the REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT placeholder. Run 'wrangler d1 create smart-qr-studio-prod' and commit the returned database_id."
            exit 1
          fi

      # Both steps require a CLOUDFLARE_API_TOKEN repository secret (Workers
      # + D1 edit permissions) — never hardcoded here. See README →
      # "Deploying" for the one-time `wrangler d1 create` setup this
      # assumes already exists for the production database; migrations are
      # applied here on every deploy (idempotent — already-applied
      # migrations are skipped) so a fresh production database is never
      # left schema-less after the Worker itself goes live.
      - name: Apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:remote:production

      - name: Deploy to Cloudflare Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:production
