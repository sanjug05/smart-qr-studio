name: Deploy Dynamic QR Backend

# Only runs when something under backend/ actually changes — the frontend's
# own deploy.yml is completely separate and untouched by this workflow.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test

      # Both steps require a CLOUDFLARE_API_TOKEN repository secret (Workers
      # + D1 edit permissions) — never hardcoded here. See README →
      # "Deploying" for the one-time `wrangler d1 create` setup this
      # assumes already exists for the production database; migrations are
      # applied here on every deploy (idempotent — already-applied
      # migrations are skipped) so a fresh production database is never
      # left schema-less after the Worker itself goes live.
      - name: Apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:remote:production

      - name: Deploy to Cloudflare Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:production
