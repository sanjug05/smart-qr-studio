name: QR Build (CI only)

# CI ONLY. This workflow builds, tests and fingerprints Smart QR Studio. It cannot publish anything:
#   - no Google credentials, no Firebase authentication, no Hosting secrets, no `id-token: write`,
#   - no Hosting API call, no deployment step.
# Publishing is done by an operator on a local machine with scripts/deploy-qr-hosting.mjs, using the uploaded
# artifact (dist/ + build-manifest.json). See docs/qr-publishing.md.
#
# Only a successful push to main uploads an artifact (named qr-release-<commit>). Pull-request builds upload nothing and
# there is deliberately no manual trigger. The publisher independently re-verifies the run, commit and artifact digest
# against the public GitHub API and refuses anything else.
#
# Only repository VARIABLES are read (public Firebase web-app configuration and the public API URL, the same values
# that end up in the public bundle). No secrets are read.

on:
  pull_request: # CI only: runs every check but produces NO artifact
  push:
    branches: [main] # the only trigger that produces a production-eligible artifact

permissions:
  contents: read

concurrency:
  group: qr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Publisher tests (fake Hosting API; guards and mutation tests)
        run: npm run test:publisher
      - name: AIS source scan
        run: npm run check:source-neutral
      - name: Production build (same settings as the live site)
        env:
          VITE_BASE_PATH: /qr/
          VITE_PWA_SCOPE: /qr
          VITE_PUBLIC_BASE_URL: https://sanjugupta.com/qr/
          VITE_DEFAULT_PLAN: business
          VITE_DYNAMIC_QR_API_BASE_URL: ${{ vars.DYNAMIC_QR_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
        run: npm run build
      - name: AIS bundle scan (also runs as the build's postbuild step)
        run: node scripts/check-bundle-neutral.mjs
      - name: SHA-256 file manifest and build identity
        run: npm run build:manifest
      - name: Show manifest summary
        run: node -e "const m=require('./build-manifest.json');console.log(JSON.stringify({files:m.fileCount,bytes:m.totalBytes,filesSha256:m.filesSha256,meta:m.meta},null,2))"
      - name: Upload the production-eligible artifact (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qr-release-${{ github.sha }}
          path: |
            dist
            build-manifest.json
          if-no-files-found: error
          retention-days: 30
