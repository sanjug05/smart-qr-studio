name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Dynamic QR API origin is supplied as a repository *variable*
      # (Settings > Secrets and variables > Actions > Variables >
      # DYNAMIC_QR_API_BASE_URL) — it is a public URL, not a secret. Unset,
      # the build still succeeds and Dynamic QR fails closed at runtime (see
      # src/services/dynamicQr/config.ts); this step only refuses a value
      # that could ship a broken or unsafe build.
      - name: Validate Dynamic QR API URL
        env:
          API_URL: ${{ vars.DYNAMIC_QR_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning title=Dynamic QR API not configured::Repository variable DYNAMIC_QR_API_BASE_URL is not set. The site will deploy, but Dynamic QR will fail closed until it is."
            exit 0
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error title=Invalid DYNAMIC_QR_API_BASE_URL::Must start with https://"; exit 1 ;;
          esac
          case "$API_URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*'[::1]'*) echo "::error title=Invalid DYNAMIC_QR_API_BASE_URL::A production build must not point at localhost."; exit 1 ;;
          esac

      - name: Build
        # Serves the app from https://<owner>.github.io/<repo>/ — a GitHub
        # Pages *project* site. If you deploy to a user/org site or a
        # custom domain instead, set VITE_BASE_PATH="/" here.
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # The product currently operates at Business level (no plan tiers
          # sold yet). Keep in step with DEFAULT_PLAN in
          # DEFAULT_PLAN in backend/src/config.ts; remove to fall back to
          # the safe default (free). See src/services/entitlements/.
          VITE_DEFAULT_PLAN: business
          VITE_DYNAMIC_QR_API_BASE_URL: ${{ vars.DYNAMIC_QR_API_BASE_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
