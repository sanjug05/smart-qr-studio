<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141417" />
    <meta name="description" content="Smart QR Studio — create branded QR codes that open up to five destinations from a single scan." />
    <title>Smart QR Studio</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <!--
      vite-plugin-pwa injects the manifest <link> at build time. Service
      worker registration is deliberately NOT auto-injected here
      (injectRegister: false in vite.config.ts) — it's done from React via
      `virtual:pwa-register/react` (see src/hooks/usePwaUpdate.tsx), which
      is what lets the app show its own "Update available" prompt instead
      of Workbox silently swapping versions underneath the user.
    -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
